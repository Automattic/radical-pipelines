name: opencode integration

# The isolated suite against the latest stable opencode release, on every pull request.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: opencode-integration-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  opencode:
    runs-on: ubuntu-latest
    if: github.head_ref != 'changeset-release/trunk'
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test:opencode
        env:
          TMPDIR: ${{ runner.temp }}
