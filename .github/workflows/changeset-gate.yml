name: Changeset Gate

# Every pull request, whatever its base. A stacked PR targets the branch
# below it rather than trunk, and a base filter of `trunk` left those PRs
# with no checks at all — the gate ran only once the stack collapsed. The
# changeset presence check already compares against the PR's own base, so
# each PR in a stack is judged on its own changes.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: changeset-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changeset:
    runs-on: ubuntu-latest
    if: github.head_ref != 'changeset-release/trunk' # bot-PR exemption
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Validate changeset shape
        run: node scripts/validate-changesets.mjs

      - name: Check version sync
        run: node scripts/check-version-sync.mjs

      - name: Require a changeset for release-relevant changes
        run: npx changeset status --since=origin/${{ github.event.pull_request.base.ref }}
