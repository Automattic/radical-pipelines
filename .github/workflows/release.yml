name: Release

on:
  push:
    branches: [trunk]
  workflow_dispatch: {}

permissions:
  contents: write # push bump commit to changeset-release/trunk; push tag; create Release
  pull-requests: write # open/update the Version Packages PR

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - id: changesets
        uses: changesets/action@fdf536a68c4154480c89b42547f8102cf0d8bc47 # v2.1.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: npm run release:version # MUST override default to keep sync-version (R3)
          publish-script: npx changeset git-tag # creates v<version> tag; action then creates the Release
