name: Release

on:
  push:
    branches: [trunk]
  workflow_dispatch: {}

permissions:
  contents: write # push bump commit to changeset-release/trunk; push tag; create Release
  pull-requests: write # open/update the Version Packages PR

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: npm run release:version # MUST override default to keep sync-version (R3)
          publish-script: npx changeset git-tag # creates v<version> tag; action then creates the Release
